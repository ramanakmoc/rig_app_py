{% extends "base.html" %}
{% load core_extras %}
{% block content %}
<div class="page-header">
  <h3>&#9998; Edit HSD Issue</h3>
  <a href="{% url 'hsd_issues' %}" class="btn btn-outline-secondary btn-sm">&#8592; Back</a>
</div>
<div class="card-box" style="max-width:780px">
  <form method="POST">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" value="{{ obj.date|date:'Y-m-d' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Rig</label>
        <select name="rig" class="form-select">
          {% for r in rigs %}<option value="{{ r }}" {% if obj.rig == r %}selected{% endif %}>{{ r }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Purpose</label>
        <select name="purpose" class="form-select" id="purposeSelect" onchange="filterEquipment()">
          {% for p in "Generator,Equipment,Drilling,Vehicle,Camp,Other"|split:"," %}
          <option value="{{ p }}" {% if obj.purpose == p %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Issued To</label>
        <input type="text" name="issued_to" class="form-control" value="{{ obj.issued_to }}" id="issuedTo">
      </div>
      <div class="col-md-6">
        <label class="form-label">Equipment</label>
        <select name="equipment" class="form-select" id="equipmentSelect" onchange="setIssuedTo()">
          <option value="">— None —</option>
          {% for e in equipment_list %}
          <option value="{{ e.pk }}"
            data-type="{{ e.equipment_type }}"
            data-label="{{ e.equipment_no }} ({{ e.registration_no }})"
            {% if obj.equipment.pk == e.pk %}selected{% endif %}>
            {{ e.equipment_no }} ({{ e.equipment_type }})
          </option>
          {% endfor %}
        </select>
      </div>
      <!-- Meter Reading -->
      <div class="col-12">
        <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px">
          <div class="row g-3">
            <div class="col-12"><small style="color:#16a34a;font-weight:600">&#9881; Meter / Hour Reading</small></div>
            <div class="col-md-3 col-6">
              <label class="form-label">Starting Reading</label>
              <input type="number" step="0.1" name="meter_start" id="meterStart"
                     class="form-control" value="{{ obj.meter_start|default:'' }}"
                     style="background:#eff6ff" oninput="calcMeterHours()">
            </div>
            <div class="col-md-3 col-6">
              <label class="form-label">Ending Reading</label>
              <input type="number" step="0.1" name="meter_end" id="meterEnd"
                     class="form-control" value="{{ obj.meter_end|default:'' }}"
                     oninput="calcMeterHours()">
            </div>
            <div class="col-md-3 col-6">
              <label class="form-label">Hours Run (auto)</label>
              <input type="number" step="0.1" name="meter_hours" id="meterHours"
                     class="form-control" readonly style="background:#f0fdf4;font-weight:700"
                     value="{{ obj.meter_hours|default:'' }}">
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <label class="form-label">Qty (L)</label>
        <input type="number" step="0.01" name="quantity_ltrs" class="form-control" value="{{ obj.quantity_ltrs }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Issued By</label>
        <input type="text" name="issued_by" class="form-control" value="{{ obj.issued_by|default:'' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Remarks</label>
        <textarea name="remarks" class="form-control" rows="2">{{ obj.remarks|default:'' }}</textarea>
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-success px-4">&#10003; Update</button>
      <a href="{% url 'hsd_issues' %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
const purposeTypeMap = {
  'Generator': ['Generator'],
  'Equipment': ['Crane','Forklift','Hydra','Compressor','Pump','Other','Trailer'],
  'Drilling':  ['Pump'],
  'Vehicle':   ['Vehicle','Trailer'],
  'Camp':      ['Other'],
  'Other':     [],
};

function filterEquipment() {
  const purpose = document.getElementById('purposeSelect').value;
  const sel = document.getElementById('equipmentSelect');
  const types = purposeTypeMap[purpose] || [];
  for (let opt of sel.options) {
    if (!opt.value) { opt.style.display = ''; continue; }
    opt.style.display = (types.length === 0 || types.includes(opt.dataset.type)) ? '' : 'none';
  }
  sel.value = '';
}

function setIssuedTo() {
  const sel = document.getElementById('equipmentSelect');
  const opt = sel.options[sel.selectedIndex];
  if (opt && opt.value) {
    document.getElementById('issuedTo').value = opt.dataset.label;
  }
}

// Run on load to filter based on current purpose
filterEquipment();

function calcMeterHours() {
  const start = parseFloat(document.getElementById('meterStart').value);
  const end   = parseFloat(document.getElementById('meterEnd').value);
  if (!isNaN(start) && !isNaN(end) && end >= start) {
    document.getElementById('meterHours').value = (end - start).toFixed(1);
  }
}
</script>
{% endblock %}
