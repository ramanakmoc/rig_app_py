<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — KRISS DRILLING PVT. LTD.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f3f5f9; font-family:'Segoe UI',Arial,sans-serif; }
    .login-card {
      max-width:420px; margin:80px auto; background:#fff;
      padding:40px; border-radius:12px;
      box-shadow:0 6px 24px rgba(0,0,0,.10);
    }
    .brand { text-align:center; margin-bottom:28px; }
    .brand h5 { color:#0b3d6d; font-weight:700; margin:10px 0 2px; font-size:15px; }
    .brand p  { color:#6c757d; font-size:13px; margin:0; }
    .btn-login {
      background:#0b3d6d; color:#fff; width:100%; padding:10px;
      border:none; border-radius:6px; font-size:15px; font-weight:600;
    }
    .btn-login:hover { background:#1a5a9a; }
    .form-control { border-color:#e2e8f0; }
    .form-control:focus { border-color:#0b3d6d; box-shadow:0 0 0 3px rgba(11,61,109,.1); }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <h5>KRISS DRILLING PVT. LTD.</h5>
    <p>Rig Operations Monitoring System</p>
  </div>

  {% if form.errors %}
  <div class="alert alert-danger py-2" style="font-size:13px">Invalid username or password.</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:13px">Username</label>
      <input type="text" name="username" class="form-control"
             value="{{ form.username.value|default:'' }}"
             autofocus required autocomplete="username">
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:13px">Password</label>
      <input type="password" name="password" class="form-control"
             required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">Sign In</button>
  </form>
</div>
</body>
</html>
