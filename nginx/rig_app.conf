server {
    listen 80;
    server_name db.krissdrilling.com www.db.krissdrilling.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name db.krissdrilling.com www.db.krissdrilling.com;

    ssl_certificate     /etc/letsencrypt/live/db.krissdrilling.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.krissdrilling.com/privkey.pem;

    client_max_body_size 30M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    location ^~ /media/email_reports/ {
        return 404;
    }

    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
